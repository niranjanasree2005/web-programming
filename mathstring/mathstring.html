<html>
<body bgcolor="pink">
<h1><center><i>string and math function</i></center></h1>
<script>
var a="hey";
var b=4;
var c="hello"
var d=56;
document.write("strings " + a +"<br><br>");
document.write("strings " + b +"<br><br>")
document.write("strings " + c +"<br><br>")
document.write("strings " + d +"<br><br>")
document.write("<h2>String functions</h2>")

document.write("tuLowerCase=" + a.toLowerCase()+"<br><br>");
document.write("Round=" + Math.round(4.6) +"<br><br>");
document.write("Floor=" + Math.floor(4.9) +"<br><br>");
document.write("Length=" + a.length+"<br><br>");


</script>
